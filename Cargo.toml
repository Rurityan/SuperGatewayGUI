[package]
name = "supergateway-gui"
version = "2.0.0"
edition = "2024"
license = "MIT"
default-run = "SuperGatewayGUI"

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "SuperGatewayGUI"
path = "src/main.rs"

[[bin]]
name = "mock-mcp"
path = "src/bin/mock_mcp.rs"

[[bin]]
name = "gateway-checks"
path = "src/bin/checks.rs"

[[bin]]
name = "desktop-checks"
path = "src/bin/desktop_checks.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
jsonc-parser = { version = "0.34", features = ["serde", "serde_json", "preserve_order"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
time = "0.3"
windows-sys = { version = "0.61.2", features = [
 "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization",
 "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation",
 "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Time",
 "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug",
 "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
 "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse",
 "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
